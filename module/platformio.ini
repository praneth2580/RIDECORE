; RIDECORE's handlebar module firmware (README.md): one sketch, its pins picked by the
; board. From this folder, with the board on a computer by USB:
;
;   pio run -e esp32-s3 -t upload      build and flash (pick the env for your board)
;   pio device monitor                  watch the lines it sends; type {"t":"hi"} for its hello
;
; The Arduino IDE builds the same sketch: open ridecore_module/ridecore_module.ino.

[platformio]
src_dir = ridecore_module
default_envs = esp32-s3

[env]
framework = arduino
monitor_speed = 115200

; ESP32-S3 DevKitC-1, on its "USB" port. The board already sets ARDUINO_USB_MODE=1.
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 SuperMini and the like, on their own USB.
[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32 DevKit V1 (CP2102 or CH340 USB chip).
[env:esp32]
platform = espressif32
board = esp32dev

[env:uno]
platform = atmelavr
board = uno

; A clone that won't take the upload: board = nanoatmega328 (the old bootloader).
[env:nano]
platform = atmelavr
board = nanoatmega328new

[env:mega]
platform = atmelavr
board = megaatmega2560

[env:leonardo]
platform = atmelavr
board = leonardo

[env:promicro]
platform = atmelavr
board = sparkfun_promicro16

[env:pico]
platform = raspberrypi
board = pico
